syntax = "proto3";

package common;

// ============================================================
//  Tipos de acción que un bot puede realizar.
//  El Hypervisor los usa para calcular el coste en puntos.
// ============================================================
enum ActionType {
  ACTION_UNKNOWN    = 0;
  ACTION_OBSERVE    = 1;   // coste 1
  ACTION_MOVE       = 2;   // coste 2
  ACTION_ROTATE     = 3;   // coste 2 (mismo grupo que move)
  ACTION_INTERACT   = 4;   // coste 3
}

// ============================================================
//  Bot
// ============================================================

// Configuración que viaja al hacer spawn.
// El campo 'genome' es opaco (bytes) para que el Mundo
// pueda evolucionar la representación sin tocar los protos.
message BotConfig {
  string bot_id    = 1;
  bytes  genome    = 2;   // genoma serializado (msgpack, json, etc.)
  int32  budget    = 3;   // presupuesto inicial de puntos por ciclo
  map<string, string> metadata = 4;  // atributos extra libres
}

// Respuesta al spawn: dónde debe conectarse el bot.
message BotInfo {
  string bot_id         = 1;
  string hypervisor_id  = 2;
  string proxy_address  = 3;   // "host:puerto" del world_proxy al que habla el bot
  bool   ok             = 4;
  string error          = 5;
}

// Estado puntual de un bot (fitness, tick, puntos restantes).
message BotStats {
  string bot_id         = 1;
  string hypervisor_id  = 2;
  double fitness        = 3;
  int64  tick           = 4;
  int32  points_left    = 5;
}

// Estado simplificado que devuelve el Hypervisor al Gestor
// cuando solo se necesita saber si el bot está vivo.
message BotStatus {
  string bot_id  = 1;
  bool   alive   = 2;
  int32  budget  = 3;   // puntos restantes en este ciclo
}

// Lista de bots (para list_bots, etc.)
message BotList {
  repeated BotStats bots = 1;
}

// ============================================================
//  Acciones
// ============================================================

// Lo que el bot envía al Hypervisor (y éste reenvía al Gestor).
message ActionRequest {
  string     bot_id      = 1;
  ActionType action_type = 2;
  bytes      payload     = 3;   // datos específicos de la acción (posición, target…)
}

// Lo que el Mundo devuelve tras procesar la acción.
message ActionResult {
  bool   ok             = 1;
  bytes  payload        = 2;   // entidades observadas, resultado del ataque, etc.
  string error          = 3;
  int64  world_tick     = 4;   // tick del mundo en el momento de la respuesta
}

// ============================================================
//  Entidades del mundo (lo que un bot puede observar)
// ============================================================

enum EntityType {
  ENTITY_UNKNOWN   = 0;
  ENTITY_BOT       = 1;
  ENTITY_RESOURCE  = 2;
  ENTITY_OBSTACLE  = 3;
  ENTITY_PROJECTILE = 4;
}

message Vector2 {
  float x = 1;
  float y = 2;
}

message Entity {
  string     entity_id  = 1;
  EntityType type       = 2;
  Vector2    position   = 3;
  float      rotation   = 4;   // radianes
  float      health     = 5;   // 0.0 – 1.0
  map<string, string> attributes = 6;  // atributos extra libres
}

// ============================================================
//  Fitness
// ============================================================

message FitnessEntry {
  string bot_id   = 1;
  double fitness  = 2;
  int64  tick     = 3;
}

message FitnessReport {
  repeated FitnessEntry entries = 1;  // ordenado desc por fitness
  int64 generated_at_tick       = 2;
}

// ============================================================
//  Hypervisores
// ============================================================

message HypervisorInfo {
  string hypervisor_id  = 1;
  string address        = 2;
  int32  port           = 3;
  int32  proxy_port     = 4;
  int32  capacity       = 5;
  int32  current_load   = 6;
  bool   online         = 7;
}

message HypervisorList {
  repeated HypervisorInfo hypervisors = 1;
}

// ============================================================
//  Mensajes de control genéricos
// ============================================================

// Respuesta vacía con ok/error (evita repetir el mismo patrón)
message Ack {
  bool   ok    = 1;
  string error = 2;
}

// Presupuesto de puntos para un bot concreto
message BudgetEntry {
  string bot_id  = 1;
  int32  budget  = 2;
}
