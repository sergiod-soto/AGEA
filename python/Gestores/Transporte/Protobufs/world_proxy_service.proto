syntax = "proto3";

package world_proxy;

import "common.proto";

// ============================================================
//  WorldProxyService — expuesto por cada Hypervisor en su
//  proxy_port. Los Bots se conectan aquí creyendo hablar
//  directamente con el Mundo.
//
//  Cliente único: los Bots.
//
//  El bot se identifica con el header gRPC:
//    ("bot-id", "bot_001")
//
//  Las acciones disponibles y sus costes se definen en:
//    core/acciones.py
//  No hay que tocar este proto para añadir nuevas acciones.
//
//  Único RPC de acción: Act
//    action_name: nombre de la acción (debe existir en core/acciones.py)
//    payload:     datos específicos de la acción (bytes opacos)
//
//  El Hypervisor:
//    1. Extrae bot-id del header.
//    2. Consulta core/acciones.py para obtener el coste.
//    3. Descuenta puntos localmente.
//    4. Reenvía al Gestor → Mundo si hay puntos.
// ============================================================
service WorldProxyService {

  // Acción genérica. Cubre cualquier acción definida en core/acciones.py.
  // El Hypervisor valida los puntos; el Mundo interpreta el payload.
  rpc Act (ActRequest) returns (common.ActionResult);

  // Estado propio del bot. Coste: 0 puntos. Respuesta local del Hypervisor.
  rpc GetStatus (GetStatusRequest) returns (BotStatusResponse);
}

// ============================================================
//  Mensajes
// ============================================================

message ActRequest {
  string action_name = 1;  // debe coincidir con una clave de core/acciones.py
  bytes  payload     = 2;  // datos opacos; el Mundo los interpreta según action_name
}

message GetStatusRequest {}

message BotStatusResponse {
  string         bot_id      = 1;
  common.GridPos position    = 2;
  float          rotation    = 3;
  float          health      = 4;   // 0.0 – 1.0
  int32          points_left = 5;
  int64          world_tick  = 6;
  bool           alive       = 7;
}
