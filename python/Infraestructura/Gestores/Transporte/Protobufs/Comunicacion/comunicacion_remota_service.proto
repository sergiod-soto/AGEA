// Infraestructura/Transporte/Protobufs/Comunicacion/comunicacion_remota_service.proto
syntax = "proto3";
package comunicacion_remota;
import "common.proto";
import "Comunicacion/logica_mundo_service.proto";  // reutilizamos ElementoGlobalState, no lo duplicamos

service ComunicacionRemotaService {
  rpc Heartbeat (common.HeartbeatRequest) returns (common.Ack);
  rpc Ejecutar  (EjecutarRequest)         returns (EjecutarResponse);

  // NUEVO — el master (vía Comunicaciones_Local) fija/actualiza el
  // foco actual (posición de cámara + filtro de representación).
  // Unario y separado de Ejecutar(): esto es estado propio de
  // Comunicaciones_Remoto, no un reenvío a un componente remoto.
  rpc ActualizarFoco (FocoRequest) returns (common.Ack);

  // NUEVO — streaming compartido. Cualquiera que se suscriba (el
  // master u otro Unity espectador) recibe la MISMA emisión: no hay
  // un foco distinto por suscriptor, todos ven lo que el foco actual
  // esté mostrando. Por eso la petición va vacía: no se elige nada
  // al suscribirse, solo se conecta a lo que ya hay.
  rpc SuscribirseFoco (SuscribirseFocoRequest) returns (stream ActualizacionFoco);
}

enum ComponenteDestino {
  LOGICA_MUNDO = 0;
  GESTOR_MUNDO = 1;
  GESTOR_BOTS  = 2;
}

message EjecutarRequest {
  ComponenteDestino componente = 1;
  string            operacion  = 2;
  bytes             payload    = 3;
}

message EjecutarResponse {
  bool   ok      = 1;
  string error   = 2;
  bytes  payload = 3;
}

// ------------------------------------------------------------------
// Vista_Foco: fijar el foco (master) y recibir sus actualizaciones
// (master + espectadores), por streaming compartido.
// ------------------------------------------------------------------

message FocoRequest {
  common.Position min     = 1;
  common.Position max     = 2;
  repeated string incluir = 3;  // mismo filtro que ya acepta ConsultarRepresentacion
  string          modo    = 4;  // idem
}

message SuscribirseFocoRequest {
  // Vacío a propósito: suscribirse no elige nada, solo te conecta a
  // la emisión compartida del foco actual.
}

message ActualizacionFoco {
  bool   ok    = 1;
  string error = 2;

  // Campo 3 (celdas) retirado: era redundante con `representacion`
  // (que ya trae lo que Unity necesita para pintar) y mucho más
  // pesado — cada celda mandaba el elemento SERIALIZADO COMPLETO, sin
  // filtrar. Se reserva el número para que nadie lo reutilice por error.
  reserved 3;
  reserved "celdas";

  bytes                                      representacion     = 4;  // datos ya serializados de ConsultarRepresentacion
  repeated logica_mundo.ElementoGlobalState  elementos_globales = 5;
  int64                                      tick_actual        = 6;
}
