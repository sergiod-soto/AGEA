syntax = "proto3";

package hypervisor;

import "Bots/common.proto";

// ============================================================
//  HypervisorService — expuesto por cada Hypervisor.
//
//  Cliente único: el Gestor.
//
//  Flujo típico:
//    1. Gestor recibe SpawnBot del Mundo
//    2. Gestor elige el HV con más espacio libre
//    3. Gestor llama SpawnBot aquí → el HV registra el bot localmente
//    4. Al inicio de cada ciclo, Gestor llama ResetBudgets en todos los HVs
//    5. Si un bot muere o el Mundo lo elimina → Gestor llama KillBot aquí
// ============================================================
service HypervisorService {

  // ----- Ciclo de vida de bots -----

  // El Gestor ordena al HV que registre un nuevo bot localmente.
  // El HV asigna su presupuesto inicial y lo añade a su tabla interna.
  rpc SpawnBot (SpawnBotRequest) returns (common.BotInfo);

  // El Gestor ordena eliminar un bot de este HV.
  rpc KillBot (BotIdRequest) returns (common.Ack);

  // Devuelve el estado de un bot concreto (puntos, alive, uptime).
  rpc GetBotStats (BotIdRequest) returns (common.BotStats);

  // Lista todos los bots activos en este HV.
  rpc ListBots (ListBotsRequest) returns (common.BotList);

  // ----- Control de presupuesto -----

  // El Gestor resetea los presupuestos al inicio de cada ciclo.
  // Cada bot recibe su nuevo presupuesto (default o override individual).
  rpc ResetBudgets (ResetBudgetsRequest) returns (common.Ack);

  // El Gestor ajusta el presupuesto de un bot concreto fuera de ciclo.
  // Útil para penalizaciones o bonificaciones puntuales.
  rpc SetPointBudget (SetPointBudgetRequest) returns (common.Ack);

  // ----- Consultas de estado -----

  // Devuelve el estado vivo/muerto y puntos restantes de un bot.
  // Versión ligera de GetBotStats para checks rápidos.
  rpc GetBotStatus (BotIdRequest) returns (common.BotStatus);
}

// ============================================================
//  Mensajes de entrada (Request)
// ============================================================

message SpawnBotRequest {
  common.BotConfig config = 1;
}

message BotIdRequest {
  string bot_id = 1;
}

message ListBotsRequest {}   // sin parámetros: devuelve todos los bots del HV

message ResetBudgetsRequest {
  // Bots de este HV a los que se les resetea el presupuesto.
  // Normalmente es la lista completa de bots del HV, pero puede ser parcial.
  repeated string bot_ids = 1;

  // Presupuesto por defecto para los bots que no tengan override.
  int32 default_budget = 2;

  // Overrides individuales: bot_id → presupuesto especial.
  // Si un bot_id aparece aquí, ignora default_budget.
  repeated common.BudgetEntry overrides = 3;
}

message SetPointBudgetRequest {
  string bot_id = 1;
  int32  points = 2;
}
