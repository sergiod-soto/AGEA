// Infraestructura/Transporte/Protobufs/Comunicacion/logica_mundo_service.proto
syntax = "proto3";
package logica_mundo;
import "common.proto";

// ============================================================
//  LogicaMundoService — expuesto por Logica_Mundo (remoto).
// ============================================================

service LogicaMundoService {
  rpc Heartbeat (common.HeartbeatRequest) returns (LogicaMundoHeartbeatResponse);
  rpc Shutdown  (common.ShutdownRequest)  returns (common.ShutdownResponse);
  rpc AsignarId (AsignarIdRequest) returns (AsignarIdResponse);
  rpc CrearElemento     (CrearElementoRequest)     returns (common.Ack);
  rpc ModificarElemento (ModificarElementoRequest) returns (common.Ack);
  rpc EliminarElemento  (EliminarElementoRequest)  returns (common.Ack);
  rpc ResolverAccion (ResolverAccionRequest) returns (common.ActionResult);
  rpc EliminarAvatarBot (EliminarAvatarBotRequest) returns (common.Ack);

  // NUEVO -- terminar un bot: elimina su avatar (si sigue en el mundo) y
  // termina su script. Lo llama Gestor_Mundo.
  rpc MatarBot (MatarBotRequest) returns (common.Ack);

  rpc SpawnGlobalEvent   (SpawnGlobalEventRequest)   returns (SpawnGlobalEventResponse);
  rpc DespawnGlobalEvent (DespawnGlobalEventRequest) returns (common.Ack);
  rpc GetActiveEvents    (GetActiveEventsRequest)    returns (GetActiveEventsResponse);
  rpc GetElementosGlobales (GetElementosGlobalesRequest) returns (GetElementosGlobalesResponse);
  rpc ObtenerCeldasEnRegion (ObtenerCeldasEnRegionRequest) returns (ObtenerCeldasEnRegionResponse);
  rpc ObtenerBotsEnRegion (ObtenerBotsEnRegionRequest) returns (ObtenerBotsEnRegionResponse);
  rpc ActualizarCeldas (ActualizarCeldasRequest) returns (ActualizarCeldasResponse);

  // Sistema atmosférico. Mismo trío de responsabilidad que
  // ObtenerCeldasEnRegion/ActualizarCeldas, en versión atmósfera, más
  // ObtenerProgresoCiclos (dato global, no por región -- lo mismo para
  // todos los Sectores en un tick dado).
  rpc ObtenerCeldasAtmosferaEnRegion (ObtenerCeldasAtmosferaEnRegionRequest) returns (ObtenerCeldasAtmosferaEnRegionResponse);
  rpc ActualizarCeldasAtmosfera (ActualizarCeldasAtmosferaRequest) returns (common.Ack);
  rpc ObtenerProgresoCiclos (ObtenerProgresoCiclosRequest) returns (ObtenerProgresoCiclosResponse);

  // Generacion del mundo
  rpc GenerarMundo (GenerarMundoRequest) returns (common.Ack);
  rpc EstadoGeneracionMundo (EstadoGeneracionMundoRequest) returns (EstadoGeneracionMundoResponse);

  rpc ConsultarRepresentacion (ConsultarRepresentacionRequest) returns (ConsultarRepresentacionResponse);
  rpc ObtenerAudio (ObtenerAudioRequest) returns (ObtenerAudioResponse);
  rpc SaveSnapshot (SaveSnapshotRequest) returns (SaveSnapshotResponse);
  rpc LoadState    (LoadStateRequest)    returns (common.Ack);
  rpc AvanzarElementosGlobales (AvanzarElementosGlobalesRequest) returns (AvanzarElementosGlobalesResponse);
  rpc ConstruirElemento (ConstruirElementoRequest) returns (ConstruirElementoResponse);
  rpc EjecutarComandoConsola (ComandoConsolaRequest) returns (ComandoConsolaResponse);

  rpc AvanzarTick(AvanzarTickRequest) returns (common.Ack);
}

message LogicaMundoHeartbeatResponse {
  bool   ok    = 1;
  string error = 2;
}

message AsignarIdRequest {}

// FIX: el campo se llamaba "id"; logica_mundo_client.py siempre leyó
// "resp.id_elemento" (el nombre usado en el resto del sistema para
// identificar un elemento del mundo), así que aquí se renombra el
// campo del proto en vez de tocar el cliente.
message AsignarIdResponse {
  uint64 id_elemento = 1;
}

message CrearElementoRequest {
  common.Position pos     = 1;
  string          type_id = 2;
  bytes           element = 3;
}

message ModificarElementoRequest {
  common.Position pos        = 1;
  uint64          element_id = 2;
  bytes           patch      = 3;
}

message EliminarElementoRequest {
  common.Position pos        = 1;
  uint64          element_id = 2;
}

message ResolverAccionRequest {
  uint64 bot_id      = 1;
  string action_type = 2;
  bytes  payload     = 3;
}

message EliminarAvatarBotRequest {
  uint64 bot_id = 1;
}

message MatarBotRequest {
  uint64 bot_id  = 1;
  string cause   = 2;   // motivo, solo para el log
  uint64 tick_id = 3;
}

message ObtenerBotsEnRegionRequest {
  common.Position min = 1;
  common.Position max = 2;
}

message ObtenerBotsEnRegionResponse {
  bool                        ok    = 1;
  string                      error = 2;
  repeated common.BotSnapshot bots  = 3;
}

message GlobalEvent {
  string          event_id = 1;
  string          type     = 2;
  common.Position pos      = 3;
  bytes           payload  = 4;
}

message SpawnGlobalEventRequest {
  GlobalEvent event = 1;
}

message SpawnGlobalEventResponse {
  bool   ok       = 1;
  string error    = 2;
  string event_id = 3;
}

message DespawnGlobalEventRequest {
  string event_id = 1;
  string reason   = 2;
}

message GetActiveEventsRequest {}

message GetActiveEventsResponse {
  bool                 ok     = 1;
  string               error  = 2;
  repeated GlobalEvent events = 3;
}

message GetElementosGlobalesRequest {}

message ElementoGlobalState {
  string name  = 1;
  bytes  state = 2;   // JSON de elem.to_snapshot()
}

message GetElementosGlobalesResponse {
  bool                         ok                 = 1;
  string                       error              = 2;
  repeated ElementoGlobalState elementos_globales = 3;
  uint64                       tick_actual        = 4;
}

message AvanzarElementosGlobalesRequest {
  uint64 tick_id = 1;
}

message AvanzarElementosGlobalesResponse {
  bool   ok      = 1;
  string error   = 2;
  bytes  cambios = 3;
}

message ConstruirElementoRequest {
  common.Position pos          = 1;
  string          nombre_clase = 2;
  bytes           campos       = 3;
}

message ConstruirElementoResponse {
  bool   ok          = 1;
  string error       = 2;
  uint64 id_elemento = 3;
}

message ObtenerCeldasEnRegionRequest {
  common.Position min             = 1;
  common.Position max             = 2;
  common.Position excluir_min     = 3;
  common.Position excluir_max     = 4;
  bool            tiene_exclusion = 5;
}

message ObtenerCeldasEnRegionResponse {
  bool                 ok    = 1;
  string               error = 2;
  repeated common.Cell cells = 3;
}

message ActualizarCeldasRequest {
  repeated common.Cell changed_cells = 1;
  // NUEVO: movimientos entre sectores del tick (antes solo viajaban por
  // GetDelta hasta el gestor y no llegaban a Logica_Mundo).
  repeated common.MovimientoExterno movimientos_externos = 2;
}

// Un movimiento externo que Logica_Mundo NO aceptó (slot de destino ya
// ocupado). Gestor_Mundo lo usa para no migrar ese bot.
message RechazoMovimiento {
  uint64 id_elemento = 1;
  // true: no cupo ni en destino ni en origen y el elemento se eliminó
  // (caso residual); pos_devuelta no tiene sentido.
  bool eliminado = 2;
  // Posición de origen a la que volvió el elemento (si eliminado = false).
  common.Position pos_devuelta = 3;
}

message ActualizarCeldasResponse {
  bool                       ok         = 1;
  string                     error      = 2;
  repeated RechazoMovimiento rechazados = 3;
}

// ============================================================
//  Sistema atmosférico
// ============================================================

message ObtenerCeldasAtmosferaEnRegionRequest {
  common.Position min             = 1;
  common.Position max             = 2;
  common.Position excluir_min     = 3;
  common.Position excluir_max     = 4;
  bool            tiene_exclusion = 5;
}

message ObtenerCeldasAtmosferaEnRegionResponse {
  bool                           ok    = 1;
  string                         error = 2;
  repeated common.AtmosphereCell cells = 3;
}

message ActualizarCeldasAtmosferaRequest {
  repeated common.AtmosphereCell changed_atmosphere_cells = 1;
}

message ObtenerProgresoCiclosRequest {}

message ObtenerProgresoCiclosResponse {
  bool   ok             = 1;
  string error          = 2;
  double progreso_solar = 3;
  double progreso_lunar = 4;
  double progreso_anual = 5;
}

// ============================================================
//  Generación del mundo (NUEVO)
// ============================================================

// Los valores numéricos deben coincidir con
// logica_mundo.EstadoGeneracion (IntEnum). NO_INICIADA = 0 por ser el valor
// por defecto de un enum proto3.
enum EstadoGeneracion {
  NO_INICIADA = 0;
  EN_CURSO    = 1;
  COMPLETADA  = 2;
  ERROR       = 3;
}

message GenerarMundoRequest {}

message EstadoGeneracionMundoRequest {}

message EstadoGeneracionMundoResponse {
  bool             ok               = 1;  // false: falló el propio RPC
  string           error            = 2;  // motivo del fallo del RPC
  EstadoGeneracion estado           = 3;
  double           progreso         = 4;  // 0.0 - 1.0
  string           error_generacion = 5;  // por qué terminó en ERROR (si aplica)
}

message ConsultarRepresentacionRequest {
  common.Position min     = 1;
  common.Position max     = 2;
  repeated string incluir = 3;
  string          modo    = 4;
}

message ConsultarRepresentacionResponse {
  bool   ok    = 1;
  string error = 2;
  bytes  datos = 3;
}

message SaveSnapshotRequest {
  string snapshot_id = 1;
}

message SaveSnapshotResponse {
  bool   ok          = 1;
  string error       = 2;
  string snapshot_id = 3;
}

message LoadStateRequest {
  string snapshot_id = 1;
}

message ObtenerAudioRequest {
  string id_sonido = 1;
}

message ObtenerAudioResponse {
  bool   ok    = 1;
  string error = 2;

  bytes audio = 3;
}

message ComandoConsolaRequest {
  string tipo    = 1;
  bytes  payload = 2;
}

message ComandoConsolaResponse {
  bool   ok      = 1;
  string error   = 2;
  bytes  payload = 3;
}

// OJO: estos dos mensajes no tienen ningún RPC en el service (LogicaMundo.
// obtener_elemento existe pero no está expuesto). Se dejan tal cual.
message ObtenerElementoRequest {
  uint64          element_id = 1;
  string          tipo_datos = 2;  // "representacion" (default) o "serializacion"
  repeated string incluir    = 3;  // solo aplica si tipo_datos="representacion"
}

message ObtenerElementoResponse {
  bool   ok    = 1;
  string error = 2;
  bytes  datos = 3;  // JSON del dict devuelto por representacion()/serializar()
}

message AvanzarTickRequest {
  // Mismo tipo que el tick_id de StartTickRequest, para no mezclar
  // signo/anchura entre RPCs.
  uint64 tick_id = 1;
}