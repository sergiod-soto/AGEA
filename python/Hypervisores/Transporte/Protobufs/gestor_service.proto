syntax = "proto3";

package gestor;

import "common.proto";

// ============================================================
//  GestorService — expuesto por el Gestor.
//
//  Clientes:
//    - El Mundo       → SpawnBot, KillBot, NotifyBotDeath,
//                       BroadcastBudgets, SaveState, LoadState
//    - Hypervisores   → RegisterHypervisor, UpdateHypervisorLoad,
//                       ForwardAction, ListHypervisors
// ============================================================
service GestorService {

  // ----- Ciclo de vida de bots (llamado por el Mundo) -----

  // El Mundo pide al Gestor que cree un bot en algún Hypervisor.
  rpc SpawnBot (SpawnBotRequest) returns (common.BotInfo);

  // El Mundo pide eliminar un bot.
  rpc KillBot (BotIdRequest) returns (common.Ack);

  // El Mundo notifica que un bot ha muerto → el Gestor limpia registros.
  rpc NotifyBotDeath (BotDeathNotification) returns (common.Ack);

  // El Mundo ordena resetear los presupuestos en todos los HVs.
  // Se llama al inicio de cada ciclo.
  rpc BroadcastBudgets (BroadcastBudgetsRequest) returns (common.Ack);

  // ----- Persistencia -----

  // El Mundo pide guardar el estado completo de la simulación.
  rpc SaveState (SaveStateRequest) returns (common.Ack);

  // El Mundo pide restaurar un estado guardado.
  rpc LoadState (LoadStateRequest) returns (common.Ack);

  // ----- Registro y control de Hypervisores -----

  // Un Hypervisor se registra aquí al arrancar.
  rpc RegisterHypervisor (RegisterHypervisorRequest) returns (common.Ack);

  // Un Hypervisor informa de su carga actual.
  rpc UpdateHypervisorLoad (UpdateLoadRequest) returns (common.Ack);

  // Lista todos los Hypervisores conocidos.
  rpc ListHypervisors (ListHypervisorsRequest) returns (common.HypervisorList);

  // ----- Reenvío de acciones al Mundo -----

  // El Hypervisor sube la acción de un bot (ya validada en puntos).
  // El Gestor la reenvía al Mundo y devuelve el resultado.
  rpc ForwardAction (ForwardActionRequest) returns (common.ActionResult);
}

// ============================================================
//  Mensajes de entrada (Request)
// ============================================================

message SpawnBotRequest {
  common.BotConfig config = 1;
}

message BotIdRequest {
  string bot_id = 1;
}

message BotDeathNotification {
  string bot_id = 1;
  string cause  = 2;   // "combat" | "starvation"
  int64  tick   = 3;
}

message BroadcastBudgetsRequest {
  int32 default_budget = 1;
  repeated common.BudgetEntry overrides = 2;
}

message SaveStateRequest {
  string path = 1;   // ruta donde guardar (relativa a la raíz)
}

message LoadStateRequest {
  string path = 1;   // ruta desde donde cargar
}

message RegisterHypervisorRequest {
  string hypervisor_id = 1;
  string address       = 2;
  int32  port          = 3;
  int32  proxy_port    = 4;
  int32  capacity      = 5;
}

message UpdateLoadRequest {
  string hypervisor_id = 1;
  int32  current_load  = 2;
}

message ListHypervisorsRequest {}

message ForwardActionRequest {
  string bot_id        = 1;
  string hypervisor_id = 2;
  string action_type   = 3;
  bytes  payload       = 4;
}
