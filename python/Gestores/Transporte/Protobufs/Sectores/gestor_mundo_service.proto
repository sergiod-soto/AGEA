syntax = "proto3";

package gestor_mundo;

// ─────────────────────────────────────────────
//  Tipos compartidos
// ─────────────────────────────────────────────

// Posición absoluta en el grid global.
// El grid puede extenderse en cualquier dirección, incluidos valores negativos.
message Position {
  int32 x = 1;
  int32 y = 2;
}

// Celda del grid: posición + elemento serializado + type_id para el registry.
message Cell {
  Position pos      = 1;
  string   type_id  = 2;   // nombre de clase del elemento ("Bot", "Piedra", ...)
  bytes    element  = 3;   // elemento serializado como proto propio
}

// ─────────────────────────────────────────────
//  GetWorldMap
//  Nodo principal solicita el mapa completo al Gestor_Mundo.
//  Respuesta en streaming: batches de tamaño variable decididos por el servidor.
// ─────────────────────────────────────────────

message GetWorldMapRequest {
  bool only_active_sectors = 1;   // si true, solo celdas de sectores ACTIVOS/DORMIDOS
}

message GetWorldMapResponse {
  repeated Cell cells = 1;   // batch de tamaño variable
}

// ─────────────────────────────────────────────
//  GetGlobalState
//  Estado global del mundo: ciclos temporales, tick actual, snapshot_id.
// ─────────────────────────────────────────────

message GetGlobalStateRequest {}

message GlobalElementState {
  string name  = 1;   // nombre del elemento global ("CicloDiaNoche", "CicloLunar", ...)
  bytes  state = 2;   // estado serializado como JSON
}

message GetGlobalStateResponse {
  bool   ok          = 1;
  string error       = 2;
  int64  tick_id     = 3;
  string snapshot_id = 4;
  repeated GlobalElementState elementos_globales = 5;
}

// ─────────────────────────────────────────────
//  GetSnapshotInfo
//  Metadatos del último snapshot disponible.
// ─────────────────────────────────────────────

message GetSnapshotInfoRequest {}

message GetSnapshotInfoResponse {
  bool   ok               = 1;
  string error            = 2;
  string snapshot_id      = 3;
  int64  tick_id          = 4;
  int64  timestamp_unix   = 5;   // epoch del momento del snapshot
  bool   is_deep_snapshot = 6;   // true si fue un guardado profundo coordinado
}

// ─────────────────────────────────────────────
//  TriggerDeepSave
//  Fuerza un guardado profundo coordinado (pausa + snapshot + reanuda).
// ─────────────────────────────────────────────

message TriggerDeepSaveRequest {}

message TriggerDeepSaveResponse {
  bool   ok          = 1;
  string error       = 2;
  string snapshot_id = 3;   // id del snapshot generado
}

// ─────────────────────────────────────────────
//  Pause / Resume
//  Control manual de pausa desde el nodo principal.
// ─────────────────────────────────────────────

message PauseRequest {}

message PauseResponse {
  bool   ok    = 1;
  string error = 2;
}

message ResumeRequest {}

message ResumeResponse {
  bool   ok    = 1;
  string error = 2;
}

// ─────────────────────────────────────────────
//  SetTickSpeed
//  Cambia la velocidad del tick en caliente.
//  speed_factor: 1.0 = velocidad normal, 0.5 = mitad, 2.0 = doble.
//  Un valor de 0.0 pausa el mundo (equivalente a Pause).
// ─────────────────────────────────────────────

message SetTickSpeedRequest {
  float speed_factor = 1;
}

message SetTickSpeedResponse {
  bool   ok               = 1;
  string error            = 2;
  float  effective_factor = 3;   // factor aplicado realmente (puede diferir si hay límites)
}

// ─────────────────────────────────────────────
//  Eventos globales
// ─────────────────────────────────────────────

message GlobalEvent {
  string event_id = 1;   // id único del evento
  string type     = 2;   // tipo ("puzzle", "catastrofe", "spawn_masivo", ...)
  oneof ubicacion {
    Position pos  = 3;   // presente solo si el evento tiene posición en el grid
  }
  bytes payload   = 4;   // datos específicos del evento, serializado como proto propio
}

message SpawnGlobalEventRequest {
  GlobalEvent event = 1;
}

message SpawnGlobalEventResponse {
  bool   ok       = 1;
  string error    = 2;
  string event_id = 3;   // eco del id, confirmación
}

message DespawnGlobalEventRequest {
  string event_id = 1;
  string reason   = 2;   // "completed", "cancelled", "expired", ...
}

message DespawnGlobalEventResponse {
  bool   ok    = 1;
  string error = 2;
}

message GetActiveEventsRequest {}

message GetActiveEventsResponse {
  bool   ok    = 1;
  string error = 2;
  repeated GlobalEvent events = 3;
}

// ─────────────────────────────────────────────
//  Modificación de elementos en caliente (solo dev)
//  Solo disponible con el mundo en pausa.
// ─────────────────────────────────────────────

// Modificar stats de un elemento existente en una posición concreta
message ModifyElementRequest {
  Position pos     = 1;
  string   type_id = 2;   // tipo esperado (validación)
  bytes    patch   = 3;   // campos a sobreescribir, serializado como proto del elemento
}

message ModifyElementResponse {
  bool   ok    = 1;
  string error = 2;
}

// Crear un elemento nuevo en una posición
message CreateElementRequest {
  Position pos     = 1;
  string   type_id = 2;
  bytes    element = 3;   // elemento completo serializado
}

message CreateElementResponse {
  bool   ok    = 1;
  string error = 2;
}

// Eliminar el elemento en una posición
message DeleteElementRequest {
  Position pos = 1;
}

message DeleteElementResponse {
  bool   ok    = 1;
  string error = 2;
}

// ─────────────────────────────────────────────
//  ForwardAction
//  GestorBots reenvía una acción de bot al Mundo.
// ─────────────────────────────────────────────

message ForwardActionRequest {
  string bot_id      = 1;
  string action_type = 2;
  bytes  payload     = 3;
}

message ForwardActionResponse {
  bool   ok      = 1;
  string error   = 2;
  bytes  payload = 3;
  int64  tick_id = 4;
}

// ─────────────────────────────────────────────
//  GestorMundoService
// ─────────────────────────────────────────────

service GestorMundoService {
  // Consulta del mundo
  rpc GetWorldMap        (GetWorldMapRequest)        returns (stream GetWorldMapResponse);
  rpc GetGlobalState     (GetGlobalStateRequest)     returns (GetGlobalStateResponse);
  rpc GetSnapshotInfo    (GetSnapshotInfoRequest)    returns (GetSnapshotInfoResponse);

  // Control del ciclo de vida
  rpc Pause              (PauseRequest)              returns (PauseResponse);
  rpc Resume             (ResumeRequest)             returns (ResumeResponse);
  rpc SetTickSpeed       (SetTickSpeedRequest)       returns (SetTickSpeedResponse);
  rpc TriggerDeepSave    (TriggerDeepSaveRequest)    returns (TriggerDeepSaveResponse);

  // Eventos globales
  rpc SpawnGlobalEvent   (SpawnGlobalEventRequest)   returns (SpawnGlobalEventResponse);
  rpc DespawnGlobalEvent (DespawnGlobalEventRequest) returns (DespawnGlobalEventResponse);
  rpc GetActiveEvents    (GetActiveEventsRequest)    returns (GetActiveEventsResponse);

  // Modificación en caliente (solo dev, requiere pausa)
  rpc ModifyElement      (ModifyElementRequest)      returns (ModifyElementResponse);
  rpc CreateElement      (CreateElementRequest)      returns (CreateElementResponse);
  rpc DeleteElement      (DeleteElementRequest)      returns (DeleteElementResponse);

  // Acciones de bots (enviadas por GestorBots)
  rpc ForwardAction     (ForwardActionRequest)       returns (ForwardActionResponse);
}
