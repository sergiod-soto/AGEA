// Infraestructura/Gestores/Transporte/Protobufs/Sectores/sector_service.proto

syntax = "proto3";
package sector;
import "common.proto";

// ============================================================
//  SectorService — expuesto por cada Sector.
//
//  Cliente único: Gestor_Mundo.
//  main.py también puede llamar a Shutdown directamente.
// ============================================================

service SectorService {
  // ----- Infraestructura (main.py) -----
  // Los sectores no tienen estado que hibernar: su existencia es discreta.
  // Shutdown simplemente termina el proceso.
  rpc Shutdown         (common.ShutdownRequest)   returns (common.ShutdownResponse);

  // ----- Ciclo de vida -----
  rpc SetSectorMode    (SetSectorModeRequest)      returns (SetSectorModeResponse);
  rpc LoadState        (LoadStateRequest)          returns (LoadStateResponse);
  rpc GetState         (GetStateRequest)           returns (GetStateResponse);

  // ----- FASE 0 — preparación del tick -----
  rpc SetGhostZone     (SetGhostZoneRequest)       returns (SetGhostZoneResponse);
  rpc SetSounds        (SetSoundsRequest)          returns (SetSoundsResponse);

  rpc SetAtmosphereGhostZone (SetAtmosphereGhostZoneRequest) returns (SetAtmosphereGhostZoneResponse);
  rpc SetGlobalCycles  (SetGlobalCyclesRequest)     returns (SetGlobalCyclesResponse);
  rpc AplicarParchesAtmosfera (AplicarParchesAtmosferaRequest) returns (AplicarParchesAtmosferaResponse);

  // ----- FASE 1 — computación -----
  rpc StartTick        (StartTickRequest)          returns (StartTickResponse);

  // ----- FASE 2 — consolidación -----
  rpc GetDelta         (GetDeltaRequest)           returns (GetDeltaResponse);

  // ----- Guardado profundo coordinado -----
  rpc SaveSnapshot     (SaveSnapshotRequest)       returns (SaveSnapshotResponse);

  // ----- Consulta de atributos (debug/dev) -----
  rpc GetElementAttributes (GetElementAttributesRequest) returns (GetElementAttributesResponse);

  rpc RecibirElemento (RecibirElementoRequest) returns (RecibirElementoResponse);
  rpc ConfirmarSalida (ConfirmarSalidaRequest) returns (ConfirmarSalidaResponse);
}

// ============================================================
//  Modos de sector
// ============================================================

enum SectorMode {
  INACTIVO = 0;
  DORMIDO  = 1;
  ACTIVO   = 2;
}

// ============================================================
//  SetSectorMode
// ============================================================

message SetSectorModeRequest {
  SectorMode mode = 1;
}

message SetSectorModeResponse {
  bool   ok    = 1;
  string error = 2;
}

// ============================================================
//  LoadState / GetState
// ============================================================

message LoadStateRequest {
  repeated common.Cell           cells            = 1;
  repeated common.BotSnapshot    bots             = 2;
  repeated common.AtmosphereCell atmosphere_cells = 3;
}

message LoadStateResponse {
  bool   ok    = 1;
  string error = 2;
}

message GetStateRequest {}

message GetStateResponse {
  bool                        ok    = 1;
  string                      error = 2;
  repeated common.Cell        cells = 3;
  repeated common.BotSnapshot bots  = 4;
  // NUEVO -- ver Sector.get_state() -> (cells, celdas_atmosfera, bots).
  repeated common.AtmosphereCell atmosphere_cells = 5;
}

// ============================================================
//  FASE 0 — preparación del tick
// ============================================================

message SetGhostZoneRequest {
  uint64               tick_id     = 1;
  repeated common.Cell ghost_cells = 2;
}

message SetGhostZoneResponse {
  bool   ok    = 1;
  string error = 2;
}

// NUEVO
message SetAtmosphereGhostZoneRequest {
  uint64                         tick_id     = 1;
  repeated common.AtmosphereCell ghost_cells = 2;
}

message SetAtmosphereGhostZoneResponse {
  bool   ok    = 1;
  string error = 2;
}

message SetSoundsRequest {
  uint64                     tick_id = 1;
  repeated common.SoundEvent sounds  = 2;
}

message SetSoundsResponse {
  bool   ok    = 1;
  string error = 2;
}

message SetGlobalCyclesRequest {
  uint64 tick_id = 1;
  // tick_id: Progreso 0.0-1.0 de cada ciclo, ya calculado por quien tiene el
  // Reloj.Ciclo real (ver Sector.set_ciclos_globales) -- Sector no
  // conoce ni necesita conocer cuántos ticks dura un día/año.

  double progreso_solar = 2;
  double progreso_lunar = 3;
  double progreso_anual = 4;
}

message AplicarParchesAtmosferaRequest {
  uint64                         tick_id = 1;
  repeated common.AtmosphereCell cells   = 2;   // solo cuenta viento_objetivo
}

message AplicarParchesAtmosferaResponse {
  bool   ok    = 1;
  string error = 2;
}

message SetGlobalCyclesResponse {
  bool   ok    = 1;
  string error = 2;
}

message MovimientoRechazado {
  uint64          id_elemento  = 1;
  common.Position pos_devuelta = 2;
  bool            eliminado    = 3;
}

// ============================================================
//  FASE 1 — computación
// ============================================================

message StartTickRequest {
  uint64 tick_id    = 1;
  int32  timeout_ms = 2;
}

message StartTickResponse {
  bool   ok        = 1;
  string error     = 2;
  bool   timed_out = 3;
}

// ============================================================
//  FASE 2 — consolidación
// ============================================================

message MigratingBot {
  common.BotSnapshot bot        = 1;
  common.Position    target_pos = 2;
}

message GetDeltaRequest {
  uint64 tick_id = 1;
}

message GetDeltaResponse {
  bool                               ok                       = 1;
  string                             error                    = 2;
  uint64                             tick_id                  = 3;
  repeated common.Cell               changed_cells            = 4;
  repeated uint64                    dead_bot_ids             = 5;
  repeated common.SoundEvent         emitted_sounds           = 6;
  repeated common.AtmosphereCell     changed_atmosphere_cells = 7;
  repeated common.MovimientoSaliente movimientos_salientes    = 8;
  repeated common.EventoMundo        eventos                  = 9;
}

message RecibirElementoRequest {
  uint64                    tick_id    = 1;
  common.MovimientoSaliente movimiento = 2;
}

message RecibirElementoResponse {
  bool        ok             = 1;   // false: fallo real del RPC
  string      error          = 2;
  bool        aceptado       = 3;   // false: rechazo normal (no es un error)
  string      motivo_rechazo = 4;
  common.Cell celda_destino  = 5;   // celda resultante, solo si aceptado
}

message ConfirmarSalidaRequest {
  uint64          tick_id     = 1;
  uint64          id_elemento = 2;
  common.Position pos_origen  = 3;
}

message ConfirmarSalidaResponse {
  bool        ok           = 1;
  string      error        = 2;
  common.Cell celda_origen = 3;     // celda de origen ya sin el elemento
}

// ============================================================
//  SaveSnapshot
// ============================================================

message SaveSnapshotRequest {
  string snapshot_id = 1;
}

message SaveSnapshotResponse {
  bool   ok          = 1;
  string error       = 2;
  string snapshot_id = 3;
}

// ============================================================
//  GetElementAttributes (debug/dev)
// ============================================================

message GetElementAttributesRequest {
  repeated uint64 element_ids = 1;
}

message Valor {
  oneof valor {
    int64  entero   = 1;
    double decimal  = 2;
    bool   booleano = 3;
    string texto    = 4;
  }
}

message ElementAttributes {
  uint64             element_id      = 1;
  repeated string    comportamientos = 2;
  map<string, Valor> atributos       = 3;
}

message GetElementAttributesResponse {
  bool                       ok        = 1;
  string                     error     = 2;
  repeated ElementAttributes elementos = 3;
}
