// Infraestructura/Transporte/Protobufs/Comunicacion/logica_mundo_service.proto
syntax = "proto3";
package logica_mundo;
import "common.proto";

// ============================================================
//  LogicaMundoService — expuesto por Logica_Mundo (remoto).
//
//  Es la única fuente de verdad de: estado gold (celdas + elementos),
//  identidad (IDs), eventos globales y resolución de acciones de bots.
//
//  Clientes:
//    - Gestor_Bots   → ResolverAccion (reenvío de acciones de bots)
//    - Gestor_Mundo  → ObtenerCeldasEnRegion / ActualizarCeldas
//                      (sustituyen el antiguo acceso directo a
//                      self._gold_cells que tenía GestorMundo)
//    - Comunicacion_Remoto (local) → ConsultarRepresentacion
//                      (para Vista_Foco / Unity), y los comandos de
//                      eventos globales / edición en caliente que antes
//                      entraban a GestorMundoService
//    - main.py / bootstrap → Heartbeat, Shutdown (via common.proto)
// ============================================================

service LogicaMundoService {
  // ----- Infraestructura -----
  rpc Heartbeat (common.HeartbeatRequest) returns (LogicaMundoHeartbeatResponse);
  rpc Shutdown  (common.ShutdownRequest)  returns (common.ShutdownResponse);

  // ----- Identidad -----
  // Genera un ID nuevo y único para un elemento (incluye bots).
  // Sustituye al contador que hoy vive disperso (controlador.py / bots.py
  // gestionan apellidos, no IDs de elemento — esto es un concepto nuevo
  // centralizado aquí).
  rpc AsignarId (AsignarIdRequest) returns (AsignarIdResponse);

  // ----- Elementos — alta / edición / baja -----
  // Antes vivían en GestorMundoService (CreateElement/ModifyElement/DeleteElement).
  // Se mudan aquí porque son "qué existe", no "cuándo se computa".
  rpc CrearElemento     (CrearElementoRequest)     returns (common.Ack);
  rpc ModificarElemento (ModificarElementoRequest) returns (common.Ack);
  rpc EliminarElemento  (EliminarElementoRequest)  returns (common.Ack);

  // ----- Acciones de bots -----
  // Sustituye a GestorMundo.handle_action(). Gestor_Bots llama aquí
  // directamente (ya no pasa por Gestor_Mundo).
  rpc ResolverAccion (ResolverAccionRequest) returns (common.ActionResult);

  // ----- Eventos globales -----
  // Antes en GestorMundoService; se mudan por el mismo motivo que los elementos.
  rpc SpawnGlobalEvent   (SpawnGlobalEventRequest)   returns (SpawnGlobalEventResponse);
  rpc DespawnGlobalEvent (DespawnGlobalEventRequest) returns (common.Ack);
  rpc GetActiveEvents    (GetActiveEventsRequest)    returns (GetActiveEventsResponse);

  // ----- Soporte al ciclo de tick de Gestor_Mundo -----
  // Gestor_Mundo ya NO mantiene _gold_cells. Para construir ghost zones
  // y para la carga inicial/restauración de cada sector, pide aquí el
  // recorte de celdas que necesita por región.
  rpc ObtenerCeldasEnRegion (ObtenerCeldasEnRegionRequest) returns (ObtenerCeldasEnRegionResponse);

  // Gestor_Mundo, tras consolidar los deltas de sectores en su _fase_2,
  // entrega aquí las celdas cambiadas para que Logica_Mundo actualice
  // su estado — sustituye la escritura directa en self._gold_cells.
  rpc ActualizarCeldas (ActualizarCeldasRequest) returns (common.Ack);

  // ----- Representación (Vista_Foco / Unity, vía Comunicacion_Remoto) -----
  // Único punto de entrada para consultas de visualización. Aplica el
  // recorte por región Y el filtro por comportamiento/capa en el mismo
  // proceso donde vive el estado, para no mover más datos de los
  // estrictamente necesarios fuera de AWS.
  //
  // ABIERTO: el campo `datos` es bytes opaco. El formato concreto de
  // serialización (JSON, protobuf anidado, etc.) para cada `modo`
  // (p.ej. "heatmap" vs "snapshot_elementos") queda pendiente de definir
  // cuando se escriba vision_unity.py — aquí solo se fija el contrato
  // de transporte, no el formato interno.
  rpc ConsultarRepresentacion (ConsultarRepresentacionRequest) returns (ConsultarRepresentacionResponse);

  // ----- Persistencia -----
  rpc SaveSnapshot (SaveSnapshotRequest) returns (SaveSnapshotResponse);
  rpc LoadState    (LoadStateRequest)    returns (common.Ack);

  rpc AvanzarElementosGlobales (AvanzarElementosGlobalesRequest) returns (AvanzarElementosGlobalesResponse);
}

// ============================================================
//  Heartbeat
// ============================================================

message LogicaMundoHeartbeatResponse {
  bool   ok    = 1;
  string error = 2;
}

// ============================================================
//  Identidad
// ============================================================

message AsignarIdRequest {}

message AsignarIdResponse {
  uint64 id = 1;
}

// ============================================================
//  Elementos
// ============================================================

message CrearElementoRequest {
  common.Position pos     = 1;
  string          type_id = 2;
  bytes           element = 3;
}

message ModificarElementoRequest {
  common.Position pos     = 1;
  string          type_id = 2;
  bytes           patch   = 3;
}

message EliminarElementoRequest {
  common.Position pos = 1;
}

// ============================================================
//  Acciones de bots
// ============================================================

message ResolverAccionRequest {
  string bot_id      = 1;
  string action_type = 2;
  bytes  payload     = 3;
}

// ============================================================
//  Eventos globales
//  (mismas formas que tenía gestor_mundo_service.proto)
// ============================================================

message GlobalEvent {
  string          event_id = 1;
  string          type     = 2;
  common.Position pos      = 3;   // vacío si el evento no tiene posición
  bytes           payload  = 4;
}

message SpawnGlobalEventRequest {
  GlobalEvent event = 1;
}

message SpawnGlobalEventResponse {
  bool   ok       = 1;
  string error    = 2;
  string event_id = 3;
}

message DespawnGlobalEventRequest {
  string event_id = 1;
  string reason   = 2;   // "completed" | "cancelled" | "expired"
}

message GetActiveEventsRequest {}

message GetActiveEventsResponse {
  bool                 ok     = 1;
  string               error  = 2;
  repeated GlobalEvent events = 3;
}

message AvanzarElementosGlobalesRequest {
  int64 tick_id = 1;
}

message AvanzarElementosGlobalesResponse {
  bool   ok    = 1;
  string error = 2;
  // JSON serializado del dict de cambios. Igual que ConsultarRepresentacion,
  // el formato interno de "cambios" queda abierto hasta que se implemente
  // el primer ElementoGlobal real y se sepa qué necesita consumir Gestor_Mundo.
  bytes cambios = 3;
}

// ============================================================
//  Soporte al ciclo de tick de Gestor_Mundo
// ============================================================

// Región rectangular inclusiva-exclusiva: [min, max)
message ObtenerCeldasEnRegionRequest {
  common.Position min = 1;
  common.Position max = 2;
  // Si true, excluye del resultado la región "propia" indicada — usado
  // para ghost zones (queremos el borde ampliado SIN la región del sector).
  // Si no se necesita exclusión (p.ej. carga inicial), dejar en blanco.
  common.Position excluir_min     = 3;
  common.Position excluir_max     = 4;
  bool            tiene_exclusion = 5;
}

message ObtenerCeldasEnRegionResponse {
  bool                 ok    = 1;
  string               error = 2;
  repeated common.Cell cells = 3;
}

message ActualizarCeldasRequest {
  repeated common.Cell changed_cells = 1;
}

// ============================================================
//  Representación (Vista_Foco / Unity)
// ============================================================

message ConsultarRepresentacionRequest {
  common.Position min = 1;
  common.Position max = 2;
  // Lista de nombres de comportamiento a incluir (p.ej. "Color", "Bot").
  // Composable: Vista_Foco decide la combinación, Logica_Mundo la resuelve
  // de forma genérica contra get_comportamiento(nombre) de cada elemento.
  repeated string incluir = 3;
  // Modo de agregación/representación (p.ej. "elementos" | "heatmap").
  // Ver nota ABIERTO en la definición del RPC sobre el formato de `datos`.
  string modo = 4;
}

message ConsultarRepresentacionResponse {
  bool   ok    = 1;
  string error = 2;
  bytes  datos = 3;
}

// ============================================================
//  Persistencia
// ============================================================

message SaveSnapshotRequest {
  string snapshot_id = 1;
}

message SaveSnapshotResponse {
  bool   ok          = 1;
  string error       = 2;
  string snapshot_id = 3;
}

message LoadStateRequest {
  string snapshot_id = 1;
}
