[pytest]
testpaths = Tests
pythonpath = .
asyncio_mode = auto
markers =
    unit: pruebas puras, sin red ni I/O — dobles falsos para todo lo externo
    integration: componentes reales colaborando en el mismo proceso (gRPC real, servidor+cliente in-process)
    e2e: stack completo levantado como subprocess real, vía bootstrap.ejecutar_modo_local