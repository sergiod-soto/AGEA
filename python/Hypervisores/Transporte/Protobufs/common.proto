syntax = "proto3";

package common;

// ============================================================
//  Bot
// ============================================================

// Configuración que viaja al hacer spawn.
// genome es un array de enteros: la gramática del Mundo
// los consume uno a uno para generar el código Python del bot.
message BotConfig {
  string         bot_id   = 1;
  repeated int32 genome   = 2;  // array de enteros (GE)
  int32          budget   = 3;  // presupuesto inicial de puntos por ciclo
  map<string, string> metadata = 4;  // atributos extra libres
}

// Respuesta al spawn: dónde debe conectarse el bot.
message BotInfo {
  string bot_id         = 1;
  string hypervisor_id  = 2;
  string proxy_address  = 3;   // "host:puerto" del world_proxy al que habla el bot
  bool   ok             = 4;
  string error          = 5;
}

// Estado puntual de un bot (fitness, tick, puntos restantes).
message BotStats {
  string bot_id         = 1;
  string hypervisor_id  = 2;
  double fitness        = 3;
  int64  tick           = 4;
  int32  points_left    = 5;
}

// Estado simplificado que devuelve el Hypervisor al Gestor
// cuando solo se necesita saber si el bot está vivo.
message BotStatus {
  string bot_id  = 1;
  bool   alive   = 2;
  int32  budget  = 3;   // puntos restantes en este ciclo
}

// Lista de bots (para list_bots, etc.)
message BotList {
  repeated BotStats bots = 1;
}

// ============================================================
//  Posición en el grid
// ============================================================

// Coordenadas enteras en el grid 2D.
// Sustituye a Vector2 (el mundo es discreto, no continuo).
message GridPos {
  int32 x = 1;
  int32 y = 2;
}

// ============================================================
//  Acciones
// ============================================================

// Lo que el Mundo devuelve tras procesar cualquier acción.
// El payload es opaco: el Mundo decide qué mete según action_name.
message ActionResult {
  bool   ok         = 1;
  bytes  payload    = 2;   // resultado serializado (raycast hits, ACK, etc.)
  string error      = 3;
  int64  world_tick = 4;
}

// ============================================================
//  Observación — resultado del raycast
// ============================================================

enum EntityType {
  ENTITY_UNKNOWN    = 0;
  ENTITY_BOT        = 1;
  ENTITY_RESOURCE   = 2;
  ENTITY_OBSTACLE   = 3;
}

// Un rayo del abanico de observación.
message RayHit {
  bool       hit      = 1;  // false → el rayo no impactó nada
  EntityType type     = 2;
  int32      distance = 3;  // distancia en casillas al impacto
}

// El payload de ActionResult para "observe" se deserializa como ObserveResult.
message ObserveResult {
  repeated RayHit rays = 1;
}

// ============================================================
//  Hypervisores
// ============================================================

message HypervisorInfo {
  string hypervisor_id  = 1;
  string address        = 2;
  int32  port           = 3;
  int32  proxy_port     = 4;
  int32  capacity       = 5;
  int32  current_load   = 6;
  bool   online         = 7;
}

message HypervisorList {
  repeated HypervisorInfo hypervisors = 1;
}

// ============================================================
//  Mensajes de control genéricos
// ============================================================

// Respuesta vacía con ok/error (evita repetir el mismo patrón)
message Ack {
  bool   ok    = 1;
  string error = 2;
}

// Presupuesto de puntos para un bot concreto
message BudgetEntry {
  string bot_id  = 1;
  int32  budget  = 2;
}
